<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>My favorite animal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="animalTitle">Giraffe</h1>

    <p>Giraffes are tall.</p>

    <a href="https://en.wikipedia.org/wiki/Giraffe" target="_blank">
        Learn more about giraffes
    </a>

    <img src="img/kirahvi.jpeg" alt="A giraffe making a silly face">

    <p><button id="animalButton">Click for giraffe</button></p>
    <p><button id="animalTableButton">Show animal table</button></p>

    <div id="tableContainer">
        <table id="example" class="display" style="display: none;">
            <thead>
                <tr>
                    <th>Eläin</th>
                    <th>Elinympäristö</th>
                    <th>Ruokavalio</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Tiikeri</td>
                    <td>Metsä</td>
                    <td>Liha</td>
                </tr>
                <tr>
                    <td>Norsu</td>
                    <td>Savanni</td>
                    <td>Kasvit</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
